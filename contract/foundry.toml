[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.23"
optimizer = true
optimizer_runs = 6969
remappings = [
    "erc721a/=lib/erc721a/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# rpc endpoints (set the matching *_RPC_URL env var, or paste a url)
# launch chain = robinhood (Robinhood Chain, EVM L2, gas in ETH, chain id 4663)
[rpc_endpoints]
robinhood         = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
base    = "${BASE_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Robinhood Chain verifies on Blockscout, not Etherscan: no API key is required
# (any non-empty string is accepted), and the verifier must be passed explicitly:
#   forge verify-contract <addr> src/UwUGF.sol:UwUGF \
#     --verifier blockscout --verifier-url https://robinhoodchain.blockscout.com/api/
[etherscan]
robinhood         = { key = "blockscout", chain = 4663,  url = "https://robinhoodchain.blockscout.com/api/" }
robinhood_testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api/" }
mainnet = { key = "${ETHERSCAN_API_KEY}" }
base    = { key = "${BASESCAN_API_KEY}", chain = 8453 }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
